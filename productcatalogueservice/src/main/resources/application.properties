# ===============================
# Spring Boot Application Config
# ===============================
spring.application.name=product-catalog-service
server.port=8081

# ===============================
# Database Configuration
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/product_catalog_db
spring.datasource.username=postgres
spring.datasource.password=your_password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# JPA & Hibernate
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# Swagger/OpenAPI (if used)
# ===============================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ===============================
# Logging
# ===============================
logging.level.org.springframework=INFO
logging.level.com.org.productcatalog=DEBUG

# ===============================
# Security (JWT, if used)
# ===============================
# jwt.secret=your_jwt_secret
# jwt.expiration=3600000

# ===============================
# Other Configurations
# ===============================
